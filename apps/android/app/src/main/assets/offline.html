<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumière</title>
<style>
  html, body { height: 100%; margin: 0; background: #08090c; color: #f4f5f7;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 22px;
    background: linear-gradient(145deg, #f8222d, #b30710); display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 28px; height: 28px; fill: #fff; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 26px; color: #9aa3b2; line-height: 1.5; font-size: 15px; }
  a { display: inline-block; padding: 14px 34px; border-radius: 8px; background: #e50914; color: #fff;
    text-decoration: none; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24"><polygon points="7 3.5 20.5 11.5 7 19.5"/></svg></div>
    <h1>You're offline</h1>
    <p>Lumière needs an internet connection to stream. Check your Wi-Fi or mobile data, then try again.</p>
    <a href="https://movies.creativeclicks.art/">Try again</a>
  </div>
</body>
</html>
