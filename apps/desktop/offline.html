<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumière</title>
<style>
  html, body { height: 100%; margin: 0; background: #08090c; color: #f4f5f7;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 380px; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 24px;
    background: linear-gradient(145deg, #f8222d, #b30710); display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 32px; height: 32px; fill: #fff; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { margin: 0 0 28px; color: #9aa3b2; line-height: 1.55; font-size: 15px; }
  a { display: inline-block; padding: 14px 36px; border-radius: 8px; background: #e50914; color: #fff;
    text-decoration: none; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24"><polygon points="7 3.5 20.5 11.5 7 19.5"/></svg></div>
    <h1>Can't reach Lumière</h1>
    <p>Check your internet connection, then try again.</p>
    <a href="https://movies.creativeclicks.art/">Try again</a>
  </div>
</body>
</html>
