services:
  gmovies:
    build: .
    image: lumiere:prod
    container_name: testmovies
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    # Code (app.py, templates, static) is baked into the image; only state is mounted.
    volumes:
      - ./movies.db:/app/movies.db
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.testmovies-http.rule=Host(`testmovies.creativeclicks.art`) || Host(`movies.creativeclicks.art`)"
      - "traefik.http.routers.testmovies-http.entrypoints=http"
      - "traefik.http.routers.testmovies-https.rule=Host(`testmovies.creativeclicks.art`) || Host(`movies.creativeclicks.art`)"
      - "traefik.http.routers.testmovies-https.entrypoints=https"
      - "traefik.http.routers.testmovies-https.tls=true"
      - "traefik.http.routers.testmovies-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.testmovies.loadbalancer.server.port=5000"

networks:
  coolify:
    external: true
